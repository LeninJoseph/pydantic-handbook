site_name: Pydantic Handbook
site_url: https://leninjoseph.github.io/pydantic-handbook/
site_description: A practical, example-driven guide to Pydantic v2 for backend and AI engineering.
site_author: Lenin Joseph
repo_url: https://github.com/LeninJoseph/pydantic-handbook
repo_name: LeninJoseph/pydantic-handbook

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/shield-check
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LeninJoseph
  generator: false

copyright: Made by Lenin Joseph · Pydantic v2.13

nav:
  - Home: index.md
  - Basics:
      - Introduction: basics/index.md
      - What Is Pydantic: basics/introduction.md
      - Installation: basics/installation.md
      - Your First Model: basics/first_model.md
      - Fields: basics/fields.md
      - Validation Errors: basics/validation_errors.md
      - Strict vs Lax Mode: basics/strict_mode.md
      - Nested Models: basics/nested_models.md
  - Advanced:
      - Introduction: advanced/index.md
      - Validators: advanced/validators.md
      - Computed Fields: advanced/computed_fields.md
      - Serialization: advanced/serialization.md
      - Aliases: advanced/aliases.md
      - Model Config: advanced/model_config.md
      - Annotated Types: advanced/annotated_types.md
      - Unions: advanced/unions.md
      - Generic Models: advanced/generic_models.md
      - TypeAdapter: advanced/type_adapter.md
      - validate_call: advanced/validate_call.md
      - Dataclasses & TypedDict: advanced/dataclasses_typeddict.md
  - Production:
      - Introduction: production/index.md
      - Settings Management: production/settings.md
      - JSON Schema: production/json_schema.md
      - FastAPI: production/fastapi.md
      - Performance: production/performance.md
  - AI Engineering:
      - Introduction: ai_engineering/index.md
      - LLM Structured Outputs: ai_engineering/llm_structured_outputs.md
  - Reference:
      - Introduction: reference/index.md
      - Migrating v1 to v2: reference/migration_v1_v2.md
      - Common Pitfalls: reference/common_pitfalls.md
      - Cheat Sheet: reference/cheat_sheet.md
  - Interview Questions: interview/interview_questions.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
